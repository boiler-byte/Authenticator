<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Authenticator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#060a13"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab8ff"/>
      <stop offset="1" stop-color="#4387ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#5c96ff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#5c96ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Hintergrund -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Schild -->
  <g transform="translate(256 262)">
    <path d="M0 -132 108 -90 V-2 C108 74 56 134 0 156 -56 134 -108 74 -108 -2 V-90 Z"
          fill="#5c96ff" fill-opacity="0.12"
          stroke="url(#shield)" stroke-width="12" stroke-linejoin="round"/>
    <!-- Checkmark -->
    <path d="M-52 -4 -16 34 60 -50"
          fill="none" stroke="url(#shield)" stroke-width="20"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>